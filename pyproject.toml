[project]
name = "credit-scoring"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Morgvn Mdln", email = "morgvn.mdln@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-bigquery>=1.12.0",
    "google-cloud-bigquery>=3.43.0",
    # Capped below 3.2: dbt-bigquery pins google-cloud-storage>=2.4,<3.2.
    # Revisit by isolating dbt in its own environment if this blocks a needed package.
    "google-cloud-storage>=2.4,<3.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
credit-scoring = "credit_scoring:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/credit_scoring --cov-report=term-missing"
